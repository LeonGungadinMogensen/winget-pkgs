name: sync-fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: { }
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Sync fork with upstream
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the FORK_SYNC_TOKEN repository secret to a token with permission to update contents and workflows."
            exit 1
          fi
          gh repo sync "$REPOSITORY" -b "$BRANCH_NAME"
        env:
          # GITHUB_TOKEN cannot sync upstream changes to workflow files.
          # Use a fine-grained PAT with Contents and Workflows write access,
          # or a classic PAT with public_repo and workflow scopes.
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
